<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" class="diagram">
  <title>Laderegeln von Fruit Shipping, der Reihe nach geprüft: 1. Container und Frucht existieren, sonst 404. 2. Gewicht größer als 0 kg, sonst 400. 3. Nur klimakterische oder nur nicht-klimakterische Früchte, sonst 409. 4. Temperaturbereiche überlappen, sonst 409. 5. Kapazität reicht, genau voll ist erlaubt, sonst 409. Sind alle Regeln erfüllt, wird der Ladungsposten gespeichert und 201 Created mit Location-Header zurückgegeben.</title>
  <defs><marker id="pfeil-lade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-head" d="M0 0L10 5L0 10z"/></marker></defs>

  <circle class="d-head" cx="220" cy="16" r="6"/>
  <line class="d-line" x1="220" y1="22" x2="220" y2="48" marker-end="url(#pfeil-lade)"/>

  <!-- Regel 1 -->
  <rect class="d-box" x="40" y="50" width="360" height="44" rx="6"/>
  <circle class="d-badge" cx="64" cy="72" r="11"/><text class="d-label d-strong" x="64" y="76.5" text-anchor="middle">1</text>
  <text class="d-label" x="86" y="76.5">Container und Frucht existieren?</text>
  <line class="d-line" x1="400" y1="72" x2="468" y2="72" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="434" y="65" text-anchor="middle">nein</text>
  <rect class="d-chip" x="470" y="55" width="190" height="34" rx="17"/>
  <text class="d-label d-strong d-tx-3" x="565" y="76.5" text-anchor="middle">404 Not Found</text>
  <text class="d-small" x="565" y="104" text-anchor="middle">NotFoundException</text>
  <line class="d-line" x1="220" y1="94" x2="220" y2="124" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="228" y="113">ja</text>

  <!-- Regel 2 -->
  <rect class="d-box" x="40" y="126" width="360" height="44" rx="6"/>
  <circle class="d-badge" cx="64" cy="148" r="11"/><text class="d-label d-strong" x="64" y="152.5" text-anchor="middle">2</text>
  <text class="d-label" x="86" y="152.5">Gewicht größer als 0 kg?</text>
  <line class="d-line" x1="400" y1="148" x2="468" y2="148" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="434" y="141" text-anchor="middle">nein</text>
  <rect class="d-chip" x="470" y="131" width="190" height="34" rx="17"/>
  <text class="d-label d-strong d-tx-3" x="565" y="152.5" text-anchor="middle">400 Bad Request</text>
  <text class="d-small" x="565" y="180" text-anchor="middle">BadRequestException</text>
  <line class="d-line" x1="220" y1="170" x2="220" y2="200" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="228" y="189">ja</text>

  <!-- Regel 3 -->
  <rect class="d-box" x="40" y="202" width="360" height="44" rx="6"/>
  <circle class="d-badge" cx="64" cy="224" r="11"/><text class="d-label d-strong" x="64" y="228.5" text-anchor="middle">3</text>
  <text class="d-label" x="86" y="228.5">Kategorie passt (klimakterisch oder nicht)?</text>
  <line class="d-line" x1="400" y1="224" x2="468" y2="224" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="434" y="217" text-anchor="middle">nein</text>
  <rect class="d-chip" x="470" y="207" width="190" height="34" rx="17"/>
  <text class="d-label d-strong d-tx-3" x="565" y="228.5" text-anchor="middle">409 Conflict</text>
  <text class="d-small" x="565" y="256" text-anchor="middle">IncompatibleCargoException</text>
  <line class="d-line" x1="220" y1="246" x2="220" y2="276" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="228" y="265">ja</text>

  <!-- Regel 4 -->
  <rect class="d-box" x="40" y="278" width="360" height="44" rx="6"/>
  <circle class="d-badge" cx="64" cy="300" r="11"/><text class="d-label d-strong" x="64" y="304.5" text-anchor="middle">4</text>
  <text class="d-label" x="86" y="304.5">Temperaturbereiche überlappen sich?</text>
  <line class="d-line" x1="400" y1="300" x2="468" y2="300" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="434" y="293" text-anchor="middle">nein</text>
  <rect class="d-chip" x="470" y="283" width="190" height="34" rx="17"/>
  <text class="d-label d-strong d-tx-3" x="565" y="304.5" text-anchor="middle">409 Conflict</text>
  <text class="d-small" x="565" y="332" text-anchor="middle">TemperatureConflictException</text>
  <line class="d-line" x1="220" y1="322" x2="220" y2="352" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="228" y="341">ja</text>

  <!-- Regel 5 -->
  <rect class="d-box" x="40" y="354" width="360" height="44" rx="6"/>
  <circle class="d-badge" cx="64" cy="376" r="11"/><text class="d-label d-strong" x="64" y="380.5" text-anchor="middle">5</text>
  <text class="d-label" x="86" y="380.5">Kapazität reicht (genau voll ist erlaubt)?</text>
  <line class="d-line" x1="400" y1="376" x2="468" y2="376" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="434" y="369" text-anchor="middle">nein</text>
  <rect class="d-chip" x="470" y="359" width="190" height="34" rx="17"/>
  <text class="d-label d-strong d-tx-3" x="565" y="380.5" text-anchor="middle">409 Conflict</text>
  <text class="d-small" x="565" y="408" text-anchor="middle">CapacityExceededException</text>
  <line class="d-line" x1="220" y1="398" x2="220" y2="428" marker-end="url(#pfeil-lade)"/>
  <text class="d-small" x="228" y="417">ja</text>

  <!-- Erfolg -->
  <rect class="d-box d-tone-1" x="40" y="430" width="360" height="44" rx="6"/>
  <text class="d-text d-strong" x="220" y="457" text-anchor="middle">Ladungsposten speichern</text>
  <line class="d-line" x1="400" y1="452" x2="468" y2="452" marker-end="url(#pfeil-lade)"/>
  <rect class="d-chip" x="470" y="435" width="190" height="34" rx="17"/>
  <text class="d-label d-strong d-tx-2" x="565" y="456.5" text-anchor="middle">201 Created</text>
  <text class="d-small" x="565" y="484" text-anchor="middle">mit Location-Header</text>
</svg>
