  <rect class="d-box d-tone-2" x="106" y="140" width="64" height="36" rx="4"/>
  <text class="d-label" x="138" y="163" text-anchor="middle">Quarkus</text>
  <rect class="d-box d-tone-2" x="176" y="140" width="64" height="36" rx="4"/>
