<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 285" class="diagram">
  <title>Monolith: Lager und Verkauf in einem JAR-File. Microservices: Lager und Verkauf jeweils in einem eigenen JAR-File mit eigener Datenbank.</title>
  <line class="d-divider" x1="340" y1="10" x2="340" y2="275"/>

  <text class="d-text d-strong" x="170" y="30" text-anchor="middle">Monolith</text>
  <rect class="d-frame" x="40" y="50" width="260" height="130" rx="6"/>
  <text class="d-small" x="52" y="70">JAR-File</text>
  <rect class="d-box d-tone-2" x="62" y="88" width="100" height="70" rx="4"/>
  <text class="d-text" x="112" y="128" text-anchor="middle">Lager</text>
  <rect class="d-box d-tone-2" x="178" y="88" width="100" height="70" rx="4"/>
  <text class="d-text" x="228" y="128" text-anchor="middle">Verkauf</text>

  <text class="d-text d-strong" x="510" y="30" text-anchor="middle">Microservices</text>
  <rect class="d-frame" x="360" y="50" width="140" height="130" rx="6"/>
  <text class="d-small" x="372" y="70">JAR-File</text>
  <rect class="d-box d-tone-2" x="380" y="88" width="100" height="70" rx="4"/>
  <text class="d-text" x="430" y="128" text-anchor="middle">Lager</text>
  <rect class="d-frame" x="520" y="50" width="140" height="130" rx="6"/>
  <text class="d-small" x="532" y="70">JAR-File</text>
  <rect class="d-box d-tone-2" x="540" y="88" width="100" height="70" rx="4"/>
  <text class="d-text" x="590" y="128" text-anchor="middle">Verkauf</text>

  <line class="d-line" x1="430" y1="180" x2="430" y2="210"/>
  <path class="d-db" d="M390 218V262A40 8 0 0 0 470 262V218"/>
  <ellipse class="d-db" cx="430" cy="218" rx="40" ry="8"/>
  <text class="d-label" x="430" y="250" text-anchor="middle">Datenbank</text>
  <line class="d-line" x1="590" y1="180" x2="590" y2="210"/>
  <path class="d-db" d="M550 218V262A40 8 0 0 0 630 262V218"/>
  <ellipse class="d-db" cx="590" cy="218" rx="40" ry="8"/>
  <text class="d-label" x="590" y="250" text-anchor="middle">Datenbank</text>
</svg>
